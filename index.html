<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" href="./assets/images/brand/favicon.ico" type="image/x-icon">
</head>
<body>
    
<!-- ==================== NAVBAR ==================== -->
<header class="header">
    <nav class="navbar" aria-label="Navegación principal">
        <!-- Logo y nombre -->
        <a class="navbar__brand" href="#inicio">
            <img
                class="navbar__logo"
                src="./assets/images/brand/logo.png"
                alt=""
            >
            <span class="navbar__name">
                Alma Café
            </span>
        </a>
        <!-- Botón hamburguesa -->
        <button
            class="navbar__toggle"
            type="button"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="navbar-menu"
        >
            <span class="navbar__line"></span>
            <span class="navbar__line"></span>
            <span class="navbar__line"></span>
        </button>
        <!-- Menú desplegable -->
        <div class="navbar__menu" id="navbar-menu" hidden>
            <a class="navbar__link" href="#inicio">
                Inicio
            </a>
            <a class="navbar__link" href="#menu">
                Nuestra carta
            </a>
            <a class="navbar__link" href="#contacto">
                Contacto
            </a>
        </div>
    </nav>
</header>
<!-- ==================== FIN NAVBAR ==================== -->
<!-- ==================== HERO ==================== -->
<section class="hero" id="inicio">
    <!-- Video de fondo -->
    <video
        class="hero__video"
        autoplay
        muted
        loop
        playsinline
        aria-hidden="true"
    >
        <source
            src="./assets/videos/hero.mp4"
            type="video/mp4"
        >
    </video>
    <!-- Capa de contraste -->
    <div
        class="hero__overlay"
        aria-hidden="true"
    ></div>
    <!-- Contenido principal -->
    <div class="hero__content">
    <h1 class="hero__title">
        Descubrí
        <span class="hero__title-brand">Alma Café</span>,
        tu lugar para disfrutar un buen café
    </h1>
        <h2 class="hero__subtitle">
            Sabores que hacen especial cada pausa.
        </h2>
    </div>
    <!-- CTA inferior -->
    <a
        class="hero__cta"
        href="#menu"
    >
        <span>Explorá nuestra carta</span>
        <span
            class="hero__cta-arrow"
            aria-hidden="true"
        >↓</span>
    </a>
</section>
<!-- ==================== FIN HERO ==================== -->

<script src="./js/main.js"></script>
</body>
</html>
